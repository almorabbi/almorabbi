# One question for the picture, typed in a NEW conversation, and the whole
# answer waited for. Ends on the Assistant tab with no keyboard up, the
# question at the top of the screen and its answer under it — the picture, if
# the answer is one for a picture (shoot.yaml decides).
# Env: ASK (the question, in the interface's language). Requires l10n.js; the
# Assistant tab is open, no keyboard up.
appId: com.alsaba.almorabbi
---
- tapOn: '${output.t.chatNewConversation}'
- extendedWaitUntil:
    visible: '${output.t.chatNewConfirmTitle}'
    timeout: 15000
- tapOn: '${output.t.chatContinue}'
# The empty state is back: it offers the suggested questions again.
- extendedWaitUntil:
    visible: '${output.t.chatQ_study}'
    timeout: 30000
# The marked conversation is gone from the screen before anything else is sent.
- assertNotVisible: '(?s).*E2E test.*'
- tapOn: '${output.t.chatTypeHint}'
- inputText: '${ASK}'
- tapOn: '${output.t.a11ySendQuestion}'
# While the reply streams, the send button turns into "stop reply".
- extendedWaitUntil:
    visible: '${output.t.chatStop}'
    timeout: 20000
    optional: true
- extendedWaitUntil:
    notVisible: '${output.t.chatStop}'
    timeout: 180000
# A 5xx is the server's moment (common/server_retry.yaml).
- runFlow:
    file: ../common/server_retry.yaml
    env:
      READY: '${output.t.feedbackHelpful}'
      SHOT: assistant_server_error_retry
- extendedWaitUntil:
    notVisible: '${output.t.chatStop}'
    timeout: 180000
# The feedback row renders only under a completed reply.
- scrollUntilVisible:
    element:
      text: '${output.t.feedbackHelpful}'
    direction: DOWN
    timeout: 20000
- assertNotVisible: '${output.t.chatRetry}'
# home.yaml's back press closes the keyboard the question left open; the tab
# comes back without it.
- runFlow: ../common/home.yaml
- tapOn: '${output.lead.navAssistant}'
# Back up to the question — its text as a pattern, punctuation loosened — and
# then to the very top: the search stops as soon as the bubble's lower edge
# shows under the app bar (the English pass was photographed that way once),
# and a new conversation has nothing above its question.
- evalScript: "${output.listingAsked = '(?s).*' + ASK.replace(/[?.()*+|]/g, '.') + '.*'}"
- scrollUntilVisible:
    element:
      text: '${output.listingAsked}'
    direction: UP
    timeout: 30000
- swipe:
    start: '50%,35%'
    end: '50%,75%'
- swipe:
    start: '50%,35%'
    end: '50%,75%'
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible: '${output.listingAsked}'
    timeout: 10000
