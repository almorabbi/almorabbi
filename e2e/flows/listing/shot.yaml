# One store-listing capture. guards.js says what a picture on the Play page
# must never carry — the run's test marker, the review banner, the other
# language as running text — and each is refused here by name, so a red pass
# says which. Also: 2.0.1's review prompt is answered «لاحقًا» first, and the
# error widget is not a picture either.
# A capture that fails here fails the flow: no picture is better than that one.
# Env: SHOT (the slot id of docs/brand/store/listing_*/manifest.json), UI_LANG,
#      LISTING_QUOTES (default false; true lets the English assistant answer
#      quote Arabic). Requires l10n.js and guards.js (shoot.yaml runs both).
appId: com.alsaba.almorabbi
---
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: '${output.c.reviewPromptTitle}'
    commands:
      - tapOn: '${output.t.reviewPromptLater}'
      - waitForAnimationToEnd:
          timeout: 2000
- assertNotVisible: '${output.listingMarker}'
- assertNotVisible: '${output.listingBanner}'
- assertNotVisible: '${output.c.lit_errorWidget}'
- runFlow:
    when:
      true: "${UI_LANG != 'en' || typeof LISTING_QUOTES === 'undefined' || LISTING_QUOTES != 'true'}"
    commands:
      - assertNotVisible: '${output.listingOtherLanguage}'
- takeScreenshot: '${SHOT}'
